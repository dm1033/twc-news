name: feed-integrity

on:
  pull_request:
  push:
    branches: [main]

# Reports whether the archive still generates the feeds and whether
# feed.json passes the same validation as the restore job (JSON, schema,
# placeholder text, minimum length, newest first). It does not block a
# direct push and it does not rewrite main. The repair is
# restore-feed.yml, which runs after a bad feed.json has landed.

jobs:
  feed-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the archive and run tests
        run: |
          python3 scripts/publish.py check
          python3 -m unittest discover -s tests -v
