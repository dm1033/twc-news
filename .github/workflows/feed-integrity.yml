name: feed-integrity

# Runs the feed check and the unit tests on pull requests, and on pushes to
# main that change the code. It does not rewrite main.
#
# A push that changes the feed itself (feed.json, latest.json, posts/,
# archive/) is left to publish-feed.yml. That job regenerates the feeds
# first and then runs this same check on what main serves afterwards.
# Checking the pushed commit instead would report a state that is replaced
# seconds later: a new posts/<id>.json is not in the feeds until that job
# has run.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - feed.json
      - latest.json
      - "posts/**"
      - "archive/**"
  workflow_dispatch:

jobs:
  feed-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the archive and run tests
        run: |
          python3 scripts/publish.py check
          python3 -m unittest discover -s tests -v
