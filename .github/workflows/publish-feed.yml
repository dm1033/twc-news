name: publish-feed

# Publishing a briefing is one small file: incoming/<id>.json or
# posts/<id>.json. This job runs on the push that already landed. It
# normalises and merges what arrived (a single post, a list, a fenced
# document, unknown keys, duplicate ids, a window that is not 20), removes
# anything that is not a briefing, and writes archive/feed.json, feed.json
# and latest.json from posts/. The scheduled publisher is never asked to
# write those files: feed.json is too large for it, and it was committing
# placeholder text in its place.
#
# This job is the guard. An unrecoverable push (placeholder text, a stub,
# a file that does not parse, a deleted or shortened stored briefing) is
# restored from posts/. Recoverable briefings are kept.
#
# A refused push is a warning, not a failure: the publisher usually tries
# again within a minute, and on many days it pushed three placeholders before
# the briefing, each one a red run and an issue comment. The job is red only
# when main is not valid after the sync. Whether the day's briefing arrived
# is checked once a day by daily-briefing-check.yml.
#
# One job does the whole pass, so a capture and a repair cannot race each
# other. The commit it pushes uses GITHUB_TOKEN. GitHub does not start
# workflows from that token, which is what stops a loop.

on:
  push:
    branches: [main]
    paths:
      - feed.json
      - latest.json
      - "posts/**"
      - "archive/**"
      - "incoming/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feed-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Take in the push and regenerate the feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/sync-main.sh origin main
          python3 scripts/publish.py sync-report sync-result.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check what main now serves
        run: |
          python3 scripts/publish.py check
          python3 -m unittest discover -s tests -v

      - name: Report what the push published or refused
        run: python3 scripts/publish.py sync-verdict sync-result.json
