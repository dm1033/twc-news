name: capture-feed-posts

on:
  push:
    branches: [main]
    paths: [feed.json]

# Copies genuine new posts from a rolling feed.json into posts/ and
# archive/feed.json. It does not rewrite feed.json. A placeholder feed
# is ignored. restore-feed.yml is what replaces a bad feed.json.
# Both jobs share a concurrency group and rebase onto main so a salvage
# and a restore do not leave sibling commits.

permissions:
  contents: write

concurrency:
  group: news-feed-main
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture valid posts into the archive
        run: python3 scripts/publish.py capture-feed
      - name: Commit the archive when a new briefing was stored
        run: |
          git add -- posts archive/feed.json
          if git diff --cached --quiet; then
            echo "archive unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: keep new briefings in the news archive"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main && exit 0
            else
              git rebase --abort || true
              git reset --hard origin/main
              python3 scripts/publish.py capture-feed
              git add -- posts archive/feed.json
              if git diff --cached --quiet; then
                echo "archive unchanged after rebase"
                exit 0
              fi
              git commit -m "fix: keep new briefings in the news archive"
            fi
            sleep $((attempt * 2))
          done
          echo "push of the captured archive failed" >&2
          exit 1
